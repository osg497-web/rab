<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스킬 — 디자인 연구실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ background:#ffffff; color:#101014; }
  body{ font-family:'Pretendard','Almarai',sans-serif; min-height:100vh; position:relative; }

  :root{
    --ink:#101014;
    --ink-70:rgba(16,16,20,0.7);
    --ink-45:rgba(16,16,20,0.45);
    --ink-line:rgba(16,16,20,0.2);
    --ink-line-soft:rgba(16,16,20,0.08);
  }

  .grid-lines{ position:fixed; inset:0; z-index:0; pointer-events:none; }
  .grid-lines .v-line{ position:absolute; top:0; bottom:0; width:1px; background:var(--ink-line-soft); }
  .grid-lines .h-line{ position:absolute; left:0; right:0; height:1px; background:var(--ink-line-soft); }
  .grid-lines .cross{ position:absolute; width:10px; height:10px; margin:-5px; }
  .grid-lines .cross::before,.grid-lines .cross::after{ content:''; position:absolute; background:var(--ink-line); }
  .grid-lines .cross::before{ left:50%; top:0; bottom:0; width:1px; margin-left:-0.5px; }
  .grid-lines .cross::after{ top:50%; left:0; right:0; height:1px; margin-top:-0.5px; }

  .top-bar{
    position:relative; z-index:5; display:flex; align-items:center; justify-content:space-between;
    padding:28px 43px;
  }
  .back-link{
    font-size:12px; letter-spacing:0.03em; color:var(--ink-70); text-decoration:none;
    border:1px solid var(--ink-line); padding:6px 12px; transition:border-color .3s ease, color .3s ease;
  }
  .back-link:hover{ border-color:var(--ink); color:var(--ink); }

  .page-title{
    position:relative; z-index:5;
    font-size:56px; font-weight:800; line-height:1.15;
    padding:20px 43px 48px;
  }

  .content{ position:relative; z-index:5; padding:0 43px 160px; }

  .card-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:24px;
  }
  .card{
    border:1px solid var(--ink-line); background:rgba(255,255,255,0.6);
    transition:border-color .3s ease;
  }
  .card:hover{ border-color:var(--ink); }
  .card-thumb{
    aspect-ratio:4/3; border-bottom:1px solid var(--ink-line);
    background-image:
      repeating-linear-gradient(45deg, rgba(16,16,20,0.05) 0 1px, transparent 1px 9px);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; letter-spacing:0.08em; color:var(--ink-45);
  }
  .card-body{ padding:16px; }
  .card-title{ font-weight:700; font-size:15px; margin-bottom:6px; }
  .card-desc{ font-size:12px; line-height:1.6; color:var(--ink-70); }
  .card-tag{
    display:inline-block; margin-top:12px; font-size:11px; color:var(--ink-45);
    border:1px solid var(--ink-line); padding:3px 8px;
  }
</style>
</head>
<body>

<div class="grid-lines" aria-hidden="true">
  <span class="v-line" style="left:32%"></span>
  <span class="v-line" style="left:68%"></span>
  <span class="h-line" style="top:50%"></span>
  <span class="cross" style="left:32%; top:50%"></span>
  <span class="cross" style="left:68%; top:50%"></span>
</div>

<div class="top-bar">
  <a class="back-link" href="index.html">← 디자인 연구실</a>
</div>

<h1 class="page-title">스킬</h1>

<div class="content">
  <div class="card-grid">
    <div class="card">
      <div class="card-thumb">PROJECT 01</div>
      <div class="card-body">
        <div class="card-title">브랜드 아이덴티티</div>
        <p class="card-desc">로고, 컬러 시스템, 그래픽 모티프를 아우르는<br>브랜드 아이덴티티 작업입니다.</p>
        <span class="card-tag">BX</span>
      </div>
    </div>
    <div class="card">
      <div class="card-thumb">PROJECT 02</div>
      <div class="card-body">
        <div class="card-title">UX/UI 디자인</div>
        <p class="card-desc">사용자 경험을 고려한 인터페이스<br>설계 및 프로토타이핑 작업입니다.</p>
        <span class="card-tag">UX/UI</span>
      </div>
    </div>
    <div class="card">
      <div class="card-thumb">PROJECT 03</div>
      <div class="card-body">
        <div class="card-title">모션 그래픽</div>
        <p class="card-desc">브랜드 경험을 확장하는<br>모션 및 인터랙션 작업입니다.</p>
        <span class="card-tag">Motion</span>
      </div>
    </div>
  </div>
</div>

</body>
</html>
