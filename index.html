<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디자인 연구실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ background:#020304; color:#EAF6FF; height:100%; overflow:hidden; }
  body{ font-family:'Galmuri9', monospace; }

  .hero{ position:relative; width:100%; height:100vh; overflow:hidden; }
  canvas#brainCanvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  .loading{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:12px; letter-spacing:0.12em; color:rgba(180,220,255,0.55); z-index:5;
  }

  .stage{
    position:absolute; inset:0; z-index:4; pointer-events:none;
    padding:44px 52px; display:flex; flex-direction:column; justify-content:space-between;
  }
  .stage a{ pointer-events:auto; }

  header{ display:flex; flex-direction:column; align-items:flex-start; }
  .brand{ display:flex; flex-direction:column; gap:10px; max-width:640px; }

  .brand h1{
    font-family:'Galmuri14','Galmuri11',monospace;
    font-size:88px; font-weight:900; color:#EAF6FF;
    text-shadow:
      0 0 26px rgba(111,227,255,0.4),
      1.5px 0 0 #EAF6FF, -1.5px 0 0 #EAF6FF,
      0 1.5px 0 #EAF6FF, 0 -1.5px 0 #EAF6FF,
      1.5px 1.5px 0 #EAF6FF, -1.5px -1.5px 0 #EAF6FF,
      1.5px -1.5px 0 #EAF6FF, -1.5px 1.5px 0 #EAF6FF;
    -webkit-text-stroke:3px #EAF6FF;
  }
  .subtitle{ font-size:13px; line-height:1.65; color:rgba(200,230,255,0.55); max-width:560px; }

  nav{ display:flex; flex-direction:column; align-items:flex-start; gap:4px; margin-top:22px; }
  nav a{
    text-decoration:none; color:rgba(200,230,255,0.55); font-size:26px; padding:8px 0;
    position:relative; transition:color .3s ease;
  }
  nav a::after{
    content:''; position:absolute; left:0; bottom:2px; height:1px; width:0%;
    background:#6fe3ff; transition:width .3s ease;
  }
  nav a:hover{ color:#EAF6FF; }
  nav a:hover::after{ width:100%; }

  /* hamburger toggle — hidden on desktop, only used on mobile */
  .navToggle{
    display:none;
    position:absolute; top:44px; right:52px; z-index:20;
    width:32px; height:22px;
    flex-direction:column; justify-content:space-between;
    background:none; border:none; padding:0; cursor:pointer;
    pointer-events:auto;
  }
  .navToggle span{ display:block; height:2px; width:100%; background:#EAF6FF; transition:transform .25s ease, opacity .25s ease; }
  .navToggle.open span:nth-child(1){ transform:translateY(10px) rotate(45deg); }
  .navToggle.open span:nth-child(2){ opacity:0; }
  .navToggle.open span:nth-child(3){ transform:translateY(-10px) rotate(-45deg); }

  .scrollHint{
    align-self:center; font-size:11px; letter-spacing:0.18em; color:rgba(200,230,255,0.4);
    display:flex; flex-direction:column; align-items:center; gap:8px;
    animation:hintFloat 2.4s ease-in-out infinite;
  }
  .scrollHint .bar{ width:1px; height:26px; background:linear-gradient(to bottom, rgba(111,227,255,0.7), transparent); }
  @keyframes hintFloat{ 0%,100%{ transform:translateY(0); opacity:.7; } 50%{ transform:translateY(6px); opacity:1; } }

  /* ---------------- mobile ---------------- */
  @media (max-width:640px){
    .stage{ padding:26px 20px; }

    .brand{ max-width:72%; gap:6px; }
    .brand h1{
      font-size:32px;
      -webkit-text-stroke:1.5px #EAF6FF;
      text-shadow:
        0 0 14px rgba(111,227,255,0.4),
        1px 0 0 #EAF6FF, -1px 0 0 #EAF6FF,
        0 1px 0 #EAF6FF, 0 -1px 0 #EAF6FF;
    }
    .subtitle{ font-size:10.5px; max-width:100%; line-height:1.55; }

    .navToggle{ display:flex; top:30px; right:20px; }

    nav{
      position:absolute; top:64px; right:20px; margin-top:0; z-index:19;
      align-items:flex-end;
      background:rgba(2,3,4,0.92); border:1px solid rgba(111,227,255,0.25);
      padding:0 18px; border-radius:2px;
      max-height:0; overflow:hidden; opacity:0;
      transition:max-height .3s ease, opacity .3s ease, padding .3s ease;
    }
    nav.open{ max-height:280px; opacity:1; padding:14px 18px; }
    nav a{ font-size:17px; padding:7px 0; }

    .scrollHint{ font-size:9px; }
    .scrollHint .bar{ height:18px; }
  }
</style>
</head>
<body>

<div class="hero">
  <canvas id="brainCanvas"></canvas>
  <div class="loading" id="loadingEl">LOADING BRAIN — 0%</div>

  <div class="stage">
    <header>
      <div class="brand">
        <h1>디자인 연구실</h1>
        <p class="subtitle">디자인 연구실은 내가 멋대로 제멋대로 하고싶은거 다 할수있는<br>나만의 공간이야. 보는건 자유인데 나를 판단하는건 금물이야</p>
      </div>
      <button class="navToggle" id="navToggle" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
      <nav id="navMenu">
        <a href="#">대화하기</a>
        <a href="#">스킬</a>
        <a href="#">디자인</a>
        <a href="#">etc</a>
      </nav>
    </header>

    <div class="scrollHint">
      <span>SCROLL TO ROTATE</span>
      <span class="bar"></span>
    </div>
  </div>
</div>

<script>
  // safety net: if nothing has progressed past 0% after a few seconds,
  // the module script itself likely failed to load (wrong path, or opened via
  // file:// without a local server) — surface a clear message instead of a silent stall.
  setTimeout(() => {
    const el = document.getElementById('loadingEl');
    if (el && el.textContent.includes('0%')) {
      el.innerHTML = '모델이 로드되지 않았어요.<br>이 파일을 file://로 직접 열었다면 로컬 서버(또는 GitHub Pages)로 열어주세요.<br>콘솔(F12)에서 빨간 에러 메시지를 확인해주시면 정확한 원인을 알 수 있어요.';
      el.style.lineHeight = '1.8';
      el.style.textAlign = 'center';
    }
  }, 4000);

  window.addEventListener('error', (e) => {
    const el = document.getElementById('loadingEl');
    if (el) el.innerHTML = `스크립트 에러: ${e.message || '알 수 없는 오류'}<br>콘솔(F12)을 확인해주세요.`;
  });

  // mobile hamburger menu toggle
  const navToggle = document.getElementById('navToggle');
  const navMenu = document.getElementById('navMenu');
  navToggle.addEventListener('click', () => {
    navToggle.classList.toggle('open');
    navMenu.classList.toggle('open');
  });
  navMenu.querySelectorAll('a').forEach((a) => {
    a.addEventListener('click', () => {
      navToggle.classList.remove('open');
      navMenu.classList.remove('open');
    });
  });
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
  import { initScene } from './scene.js';

  initScene({
    canvas: document.getElementById('brainCanvas'),
    loadingEl: document.getElementById('loadingEl'),
  }).catch((err) => {
    console.error(err);
    const el = document.getElementById('loadingEl');
    if (el) el.textContent = '모델을 불러오지 못했어요 — 콘솔을 확인해주세요.';
  });
</script>
</body>
</html>
